# Gmail Cleaner (Shineori fork) - run it on your own computer
#
#   1. Put your Google OAuth credentials.json next to this file
#   2. mkdir data
#   3. docker compose up -d --build
#   4. Open http://localhost:8766, clean up, then: docker compose down
#
# Running it on a server behind Cloudflare Access instead?
# See docker-compose.server.yml and SELF_HOSTING.md.

services:
  gmail-cleaner:
    build: .
    image: gmail-cleaner:local
    container_name: gmail-cleaner

    ports:
      - "127.0.0.1:8766:8766"   # Web UI (this computer only)
      - "127.0.0.1:8767:8767"   # OAuth callback (this computer only)

    volumes:
      - type: bind
        source: ./credentials.json
        target: /app/credentials.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data              # token.json, protected_senders.json, history.json
        target: /app/data

    environment:
      - WEB_AUTH=true

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"
